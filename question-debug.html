<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SHIFT · Question Debug</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css?v=1.5.0-uuid1">
<style>
.inspector{max-width:820px;margin:0 auto;padding:clamp(16px,5vw,54px)}
.inspector section{margin-top:18px;padding:clamp(16px,4vw,28px)}
.inspector form,.debug-meta{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-top:12px}
.inspector form label{flex:1 1 260px}
.inspector input{box-sizing:border-box;display:block;width:100%;min-width:0;margin-top:6px;padding:10px;font:inherit}
.inspector p,.inspector li,.inspector code,.inspector a{overflow-wrap:anywhere}
.inspector h2:focus{outline:0}
.inspector h3{margin:18px 0 8px}
.inspector li{margin-bottom:10px}
.inspector pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:inherit}
.inspector img{max-width:100%;height:auto}
.inspector audio{display:block;width:100%;max-width:560px;margin:8px 0}
.inspect-source{margin:14px 0;border-top:1px solid #d8e5dd;padding-top:14px}
</style>
<script defer src="data/catalog.js?v=1.5.8"></script>
<script defer src="assets/question-uuid.js?v=1.5.0-uuid1"></script>
<script defer src="assets/question-debug.js?v=1.5.3"></script>
</head>
<body>
<main class="inspector" id="main">
<a href="index.html">← Back to SHIFT</a>
<h1>Question Debug</h1>
<p>Find a built-in question by its UUID. This page does not record answers or change your learning history.</p>
<form id="lookup" role="search">
<label for="question-uuid">Question UUID
<input id="question-uuid" name="uuid" type="text" autocomplete="off" spellcheck="false" autocapitalize="none" maxlength="60" placeholder="00000000-0000-0000-0000-000000000000" required>
</label>
<button type="submit" class="btn primary">Find Question</button>
</form>
<p id="lookup-status" role="status" aria-live="polite"></p>
<div id="lookup-result"></div>
<noscript>This page needs JavaScript to look up a question.</noscript>
</main>
</body>
</html>
