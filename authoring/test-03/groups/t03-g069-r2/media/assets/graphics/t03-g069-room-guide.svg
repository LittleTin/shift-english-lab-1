<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 298" role="img" aria-labelledby="title desc">
<title id="title">Cedar Meeting Centre room guide</title>
<desc id="desc">Willow: 12 people, $160, ground floor, movable tables. Birch: 24 people, $240, first floor, movable tables. Maple: 36 people, $310, ground floor, movable tables. Auditorium: 60 people, $380, first floor, fixed theatre seating. Step-free access from the car park to the ground floor. First-floor lift closed April 8 through 12. Half-day fares.</desc>
